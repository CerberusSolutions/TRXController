# Windows installer, macOS (Apple silicon) app and Linux packages. `npm run dist` builds with
# electron-vite then packages the Windows target; `npm run dist:mac` the macOS one (on a Mac);
# `npm run dist:linux` the AppImage and .deb (on Linux).
appId: uk.co.cerberus.trxcontroller
productName: TRXController
copyright: Copyright © 2026 Cerberus Systems
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
# serialport ships prebuilt N-API binaries; nothing needs compiling against Electron.
npmRebuild: false
asar: true
# Installer size: LZMA at its slowest setting, and only the English Chromium locales
# (the other 53 are 47 MB unpacked). Our own code is ~2 MB; the rest is Electron.
compression: maximum
electronLanguages:
  - en-GB
  - en-US
win:
  # The installer, and a portable zip (the same files, no installer, no shortcuts) for machines
  # where the installer is blocked, e.g. by Controlled folder access refusing the Start Menu shortcut.
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
  icon: build/icon.ico
  # Names the zip; the nsis section below names the installer.
  artifactName: ${productName}-${version}-win-x64.${ext}
  # Unsigned beta: SmartScreen will warn on first run.
  signAndEditExecutable: true
  # serialport ships prebuilt bindings for every platform; only win32-x64 is needed here.
  files:
    - "!node_modules/@serialport/bindings-cpp/prebuilds/{android-*,darwin-*,linux-*,win32-arm64,win32-ia32}/**"
mac:
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  # electron-builder makes the .icns from the 512 px PNG.
  icon: build/icon.png
  category: public.app-category.utilities
  artifactName: ${productName}-${version}-mac-arm64.${ext}
  # Unsigned and not notarised: Gatekeeper needs a right-click › Open (or xattr) on first run.
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  # The darwin prebuild is a universal (x64 + arm64) binary.
  files:
    - "!node_modules/@serialport/bindings-cpp/prebuilds/{android-*,linux-*,win32-*}/**"
dmg:
  artifactName: ${productName}-${version}-mac-arm64.${ext}
linux:
  # AppImage runs on any distro without installing; the .deb is for Ubuntu / Debian / Mint.
  # x64 for PCs, arm64 for a Raspberry Pi sat next to the scanner.
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
  icon: build/icon.png
  category: Utility
  # Lets the desktop link the running window to its launcher entry (package.json desktopName).
  syncDesktopName: true
  synopsis: Remote control and logging for the Whistler TRX-1 / TRX-2 scanner
  maintainer: Cerberus Systems <stevew@defiant.co.uk>
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
  # Only the Linux serialport prebuilds (arm and arm64 both kept for the Pi target).
  files:
    - "!node_modules/@serialport/bindings-cpp/prebuilds/{android-*,darwin-*,win32-*}/**"
deb:
  # Serial ports need the user in the dialout group; the package cannot do that for them.
  afterInstall: build/deb-after-install.sh
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: TRXController
  deleteAppDataOnUninstall: false
  artifactName: ${productName}-Setup-${version}.${ext}
